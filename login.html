<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Secure Authentication & Profile</title>
    
    <!-- 
    ====================================================================
    FIREBASE SETUP INSTRUCTIONS
    ====================================================================
    1. Create a Firebase Project (https://console.firebase.google.com/)
    2. Enable Email/Password Authentication (Build > Authentication)
    3. Enable Firestore Database (Build > Firestore Database)
       - Start in Test Mode (or set rules to allow authenticated users to read/write their own data)
    4. Register your Web App & paste the config below.
    ====================================================================
    -->

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'media',
            theme: {
                extend: {
                    colors: { slate: { 850: '#151e2e' } }
                }
            }
        }
    </script>
    
    <!-- Feather Icons -->
    <script src="https://unpkg.com/feather-icons"></script>
</head>
<body class="bg-slate-50 dark:bg-slate-900 text-slate-900 dark:text-slate-100 min-h-screen font-sans transition-colors duration-200">

    <!-- Loading View -->
    <div id="loading-view" class="min-h-screen flex items-center justify-center fixed inset-0 bg-slate-50 dark:bg-slate-900 z-50">
        <div class="flex flex-col items-center gap-4">
            <div class="animate-spin rounded-full h-10 w-10 border-b-2 border-indigo-600"></div>
            <p class="text-sm font-medium text-slate-500 dark:text-slate-400">Loading secure environment...</p>
        </div>
    </div>

    <!-- Account Setup View (New Users) -->
    <div id="setup-view" class="hidden min-h-screen flex items-center justify-center p-4">
        <div class="max-w-md w-full bg-white dark:bg-slate-800 rounded-2xl shadow-xl overflow-hidden p-8 border border-slate-200 dark:border-slate-700">
            <div class="text-center mb-8">
                <h2 class="text-2xl font-bold text-slate-900 dark:text-white">Complete your profile</h2>
                <p class="mt-2 text-sm text-slate-600 dark:text-slate-400">Let's get you set up before you enter the dashboard.</p>
            </div>

            <form id="setup-form" class="space-y-6">
                <!-- Avatar Upload -->
                <div class="flex flex-col items-center gap-4">
                    <div class="relative group cursor-pointer">
                        <div class="w-24 h-24 rounded-full overflow-hidden border-4 border-slate-100 dark:border-slate-700 bg-slate-200 dark:bg-slate-600 flex items-center justify-center">
                            <img id="avatar-preview" src="https://placehold.co/150x150/e2e8f0/475569?text=+" alt="Avatar preview" class="w-full h-full object-cover hidden" />
                            <i data-feather="camera" id="avatar-placeholder" class="w-8 h-8 text-slate-400"></i>
                        </div>
                        <div class="absolute inset-0 bg-black/40 rounded-full flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
                            <i data-feather="upload" class="w-6 h-6 text-white"></i>
                        </div>
                        <input type="file" id="avatar-upload" accept="image/*" class="absolute inset-0 w-full h-full opacity-0 cursor-pointer" />
                    </div>
                    <p class="text-xs text-slate-500">Upload profile photo</p>
                </div>

                <!-- Full Name -->
                <div>
                    <label for="setup-name" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Full Name</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-feather="user" class="h-5 w-5 text-slate-400"></i>
                        </div>
                        <input id="setup-name" type="text" required
                            class="block w-full pl-10 pr-3 py-3 border border-slate-300 dark:border-slate-600 rounded-xl focus:ring-indigo-500 focus:border-indigo-500 bg-white dark:bg-slate-900 text-slate-900 dark:text-white transition-colors"
                            placeholder="John Doe">
                    </div>
                </div>

                <!-- Date of Birth -->
                <div>
                    <label for="setup-dob" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Date of Birth</label>
                    <div class="mt-1 relative rounded-md shadow-sm">
                        <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                            <i data-feather="calendar" class="h-5 w-5 text-slate-400"></i>
                        </div>
                        <input id="setup-dob" type="date" required
                            class="block w-full pl-10 pr-3 py-3 border border-slate-300 dark:border-slate-600 rounded-xl focus:ring-indigo-500 focus:border-indigo-500 bg-white dark:bg-slate-900 text-slate-900 dark:text-white transition-colors [&::-webkit-calendar-picker-indicator]:dark:filter [&::-webkit-calendar-picker-indicator]:dark:invert">
                    </div>
                </div>

                <div id="setup-error" class="hidden text-sm text-red-500 text-center"></div>

                <button type="submit" id="setup-submit-btn" class="w-full flex justify-center items-center gap-2 py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all">
                    <span id="setup-submit-text">Save Profile</span>
                    <div id="setup-submit-spinner" class="hidden animate-spin rounded-full h-5 w-5 border-b-2 border-white"></div>
                </button>
            </form>
        </div>
    </div>

    <!-- Auth View (Login / Register / Reset) -->
    <div id="auth-view" class="hidden min-h-screen flex-col justify-center py-12 sm:px-6 lg:px-8">
        <!-- Exact same Auth form UI as before -->
        <div class="sm:mx-auto sm:w-full sm:max-w-md">
            <div class="flex justify-center text-indigo-600 dark:text-indigo-400 mb-4">
                <i data-feather="shield" class="w-12 h-12"></i>
            </div>
            <h2 id="auth-title" class="text-center text-3xl font-extrabold text-slate-900 dark:text-white">
                Sign in to your account
            </h2>
            <p class="mt-2 text-center text-sm text-slate-600 dark:text-slate-400">
                Protected by industry standard encryption
            </p>
        </div>

        <div class="mt-8 sm:mx-auto sm:w-full sm:max-w-md">
            <div class="bg-white dark:bg-slate-800 py-8 px-4 shadow-xl sm:rounded-2xl sm:px-10 border border-slate-200 dark:border-slate-700">
                
                <div id="error-alert" class="hidden mb-6 bg-red-50 dark:bg-red-900/30 border-l-4 border-red-500 p-4 rounded-md flex items-start gap-3">
                    <i data-feather="alert-circle" class="w-5 h-5 text-red-500 mt-0.5 flex-shrink-0"></i>
                    <p id="error-message" class="text-sm text-red-700 dark:text-red-300"></p>
                </div>

                <div id="success-alert" class="hidden mb-6 bg-green-50 dark:bg-green-900/30 border-l-4 border-green-500 p-4 rounded-md flex items-start gap-3">
                    <i data-feather="check-circle" class="w-5 h-5 text-green-500 mt-0.5 flex-shrink-0"></i>
                    <p id="success-message" class="text-sm text-green-700 dark:text-green-300"></p>
                </div>

                <form id="auth-form" class="space-y-6">
                    <div>
                        <label for="email" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Email address</label>
                        <div class="mt-1 relative rounded-md shadow-sm">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i data-feather="mail" class="h-5 w-5 text-slate-400"></i>
                            </div>
                            <input id="email" name="email" type="email" autocomplete="email" required
                                class="block w-full pl-10 pr-3 py-3 border border-slate-300 dark:border-slate-600 rounded-xl focus:ring-indigo-500 focus:border-indigo-500 bg-white dark:bg-slate-900 text-slate-900 dark:text-white transition-colors"
                                placeholder="you@example.com">
                        </div>
                    </div>

                    <div id="password-container">
                        <div class="flex items-center justify-between">
                            <label for="password" class="block text-sm font-medium text-slate-700 dark:text-slate-300">Password</label>
                            <button type="button" id="forgot-password-btn" class="text-sm font-medium text-indigo-600 hover:text-indigo-500 dark:text-indigo-400">
                                Forgot password?
                            </button>
                        </div>
                        <div class="mt-1 relative rounded-md shadow-sm">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <i data-feather="lock" class="h-5 w-5 text-slate-400"></i>
                            </div>
                            <input id="password" name="password" type="password" autocomplete="current-password"
                                class="block w-full pl-10 pr-10 py-3 border border-slate-300 dark:border-slate-600 rounded-xl focus:ring-indigo-500 focus:border-indigo-500 bg-white dark:bg-slate-900 text-slate-900 dark:text-white transition-colors"
                                placeholder="••••••••">
                            <button type="button" id="toggle-password-btn" class="absolute inset-y-0 right-0 pr-3 flex items-center text-slate-400 hover:text-slate-600 dark:hover:text-slate-300 focus:outline-none">
                                <i data-feather="eye" id="eye-icon" class="h-5 w-5"></i>
                            </button>
                        </div>
                    </div>

                    <button type="submit" id="submit-btn" class="w-full flex justify-center items-center gap-2 py-3 px-4 border border-transparent rounded-xl shadow-sm text-sm font-medium text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all">
                        <span id="submit-text">Sign in</span>
                        <div id="submit-spinner" class="hidden animate-spin rounded-full h-5 w-5 border-b-2 border-white"></div>
                        <i data-feather="arrow-right" id="submit-icon" class="w-4 h-4"></i>
                    </button>
                </form>

                <div class="mt-8">
                    <div class="relative">
                        <div class="absolute inset-0 flex items-center">
                            <div class="w-full border-t border-slate-200 dark:border-slate-700"></div>
                        </div>
                        <div class="relative flex justify-center text-sm">
                            <span id="divider-text" class="px-2 bg-white dark:bg-slate-800 text-slate-500">New here?</span>
                        </div>
                    </div>
                    <div class="mt-6 flex justify-center">
                        <button type="button" id="toggle-mode-btn" class="text-indigo-600 hover:text-indigo-500 dark:text-indigo-400 font-medium transition-colors">
                            Create a new account
                        </button>
                    </div>
                </div>
            </div>
            <div class="mt-8 text-center text-xs text-slate-500 flex items-center justify-center gap-1.5">
                <i data-feather="key" class="w-3.5 h-3.5"></i>
                <span>Credentials & Data are encrypted.</span>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        // New: Import Firestore for storing profile data
        import { getFirestore, doc, getDoc, setDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // Global Environment Variables
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'default-app-id';
        
        const firebaseConfig = {
            apiKey: "YOUR_API_KEY",
            authDomain: "YOUR_AUTH_DOMAIN",
            projectId: "YOUR_PROJECT_ID",
            storageBucket: "YOUR_STORAGE_BUCKET",
            messagingSenderId: "YOUR_MESSAGING_SENDER_ID",
            appId: "YOUR_APP_ID"
        };

        let app, auth, db;
        try {
            const configToUse = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : firebaseConfig;
            app = initializeApp(configToUse);
            auth = getAuth(app);
            db = getFirestore(app);
        } catch (error) {
            console.error("Firebase init error:", error);
        }

        // Initialize Icons
        feather.replace();

        // Application State
        let currentAuthMode = 'login'; 
        let isPasswordVisible = false;
        let isSubmitting = false;
        let avatarBase64 = null; // Stores profile image as Base64 string

        // DOM Elements
        const views = {
            loading: document.getElementById('loading-view'),
            auth: document.getElementById('auth-view'),
            setup: document.getElementById('setup-view'),
            dashboard: document.getElementById('authenticated-view')
        };
        
        const ui = {
            // Auth Form
            form: document.getElementById('auth-form'),
            emailInput: document.getElementById('email'),
            passwordInput: document.getElementById('password'),
            passwordContainer: document.getElementById('password-container'),
            togglePasswordBtn: document.getElementById('toggle-password-btn'),
            forgotPasswordBtn: document.getElementById('forgot-password-btn'),
            toggleModeBtn: document.getElementById('toggle-mode-btn'),
            submitBtn: document.getElementById('submit-btn'),
            submitText: document.getElementById('submit-text'),
            submitSpinner: document.getElementById('submit-spinner'),
            submitIcon: document.getElementById('submit-icon'),
            authTitle: document.getElementById('auth-title'),
            dividerText: document.getElementById('divider-text'),
            errorAlert: document.getElementById('error-alert'),
            errorMessage: document.getElementById('error-message'), 
            successAlert: document.getElementById('success-alert'),
            successMessage: document.getElementById('success-message'), 
            
            // Dashboard
            logoutBtn: document.getElementById('logout-btn'),
            userEmailDisplay: document.getElementById('user-email-display'),
            userUidDisplay: document.getElementById('user-uid-display'),
            displayAvatar: document.getElementById('display-avatar'),
            displayName: document.getElementById('display-name'),
            displayDob: document.getElementById('display-dob'),

            // Setup Form
            setupForm: document.getElementById('setup-form'),
            avatarUpload: document.getElementById('avatar-upload'),
            avatarPreview: document.getElementById('avatar-preview'),
            avatarPlaceholder: document.getElementById('avatar-placeholder'),
            setupName: document.getElementById('setup-name'),
            setupDob: document.getElementById('setup-dob'),
            setupSubmitBtn: document.getElementById('setup-submit-btn'),
            setupSubmitText: document.getElementById('setup-submit-text'),
            setupSubmitSpinner: document.getElementById('setup-submit-spinner'),
        setupError: document.getElementById('setup-error')
    };
    
    function showView(viewName) {
        Object.values(views).forEach(v => {
            if (v) { v.classList.add('hidden'); v.classList.remove('flex'); }
        });
        if (views[viewName]) {
            views[viewName].classList.remove('hidden');
            if (viewName !== 'dashboard') views[viewName].classList.add('flex');
        }
        
        // NOTE FOR LOCAL DEPLOYMENT: 
        // In a real multi-file setup, you would replace these lines with:
        // window.location.href = 'dash.html' (or 'login.html')
        if (viewName === 'auth') window.history.replaceState(null, null, '#login');
        if (viewName === 'dashboard') window.history.replaceState(null, null, '#dash');
        if (viewName === 'setup') window.history.replaceState(null, null, '#setup');
    }

    // Route Enforcement: Monitor URL changes and verify authentication
    window.addEventListener('hashchange', () => {
        const hash = window.location.hash;
        const user = auth?.currentUser;
        
        if (hash === '#dash' && !user) {
            // Unauthenticated user trying to access dashboard -> Send to login
            showView('auth');
        } else if (hash === '#login' && user) {
            // Authenticated user trying to access login -> Send to dashboard
            showView('dashboard');
        }
    });

    function showAlert(type, msg) {
            ui.errorAlert.classList.add('hidden');
            ui.successAlert.classList.add('hidden');
            if (!msg) return;
            
            if (type === 'error') {
                ui.errorMessage.textContent = msg;
                ui.errorAlert.classList.remove('hidden');
            } else {
                ui.successMessage.textContent = msg;
                ui.successAlert.classList.remove('hidden');
            }
        }

        function updateUIForMode() {
            showAlert(null);
            ui.passwordInput.value = '';

            if (currentAuthMode === 'login') {
                ui.authTitle.textContent = 'Sign in to your account';
                ui.passwordContainer.classList.remove('hidden');
                ui.passwordInput.required = true;
                ui.forgotPasswordBtn.classList.remove('hidden');
                ui.submitText.textContent = 'Sign in';
                ui.dividerText.textContent = 'New here?';
                ui.toggleModeBtn.textContent = 'Create a new account';
            } else if (currentAuthMode === 'register') {
                ui.authTitle.textContent = 'Create a secure account';
                ui.passwordContainer.classList.remove('hidden');
                ui.passwordInput.required = true;
                ui.forgotPasswordBtn.classList.add('hidden');
                ui.submitText.textContent = 'Create account';
                ui.dividerText.textContent = 'Already have an account?';
                ui.toggleModeBtn.textContent = 'Sign in to existing account';
            } else if (currentAuthMode === 'reset') {
                ui.authTitle.textContent = 'Reset your password';
                ui.passwordContainer.classList.add('hidden');
                ui.passwordInput.required = false;
                ui.submitText.textContent = 'Send reset link';
                ui.dividerText.textContent = 'Remembered your password?';
                ui.toggleModeBtn.textContent = 'Back to sign in';
            }
            feather.replace();
        }

        // Toggles
        ui.togglePasswordBtn.addEventListener('click', () => {
            isPasswordVisible = !isPasswordVisible;
            ui.passwordInput.type = isPasswordVisible ? 'text' : 'password';
            ui.togglePasswordBtn.innerHTML = `<i data-feather="${isPasswordVisible ? 'eye-off' : 'eye'}" class="h-5 w-5"></i>`;
            feather.replace();
        });

        ui.toggleModeBtn.addEventListener('click', () => {
            currentAuthMode = currentAuthMode === 'login' ? 'register' : 'login';
            updateUIForMode();
        });

        ui.forgotPasswordBtn.addEventListener('click', () => {
            currentAuthMode = 'reset';
            updateUIForMode();
        });

        const getSecureErrorMessage = (code) => {
            if (code.includes('user-not-found') || code.includes('wrong-password') || code.includes('invalid-credential')) return 'Invalid email or password.';
            if (code.includes('too-many-requests')) return 'Too many attempts. Please try again later.';
            if (code.includes('email-already-in-use')) return 'An error occurred. Please try logging in.';
            if (code.includes('weak-password')) return 'Password must be at least 6 characters.';
            return 'An unexpected error occurred. Please try again.';
        };

        ui.form.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (isSubmitting || !auth) return;

            const email = ui.emailInput.value.trim();
            const password = ui.passwordInput.value;

            isSubmitting = true;
            ui.submitBtn.disabled = true;
            ui.submitText.classList.add('hidden');
            ui.submitIcon.classList.add('hidden');
            ui.submitSpinner.classList.remove('hidden');
            showAlert(null);

            try {
                if (currentAuthMode === 'login') {
                    await signInWithEmailAndPassword(auth, email, password);
                } else if (currentAuthMode === 'register') {
                    await createUserWithEmailAndPassword(auth, email, password);
                } else if (currentAuthMode === 'reset') {
                    await sendPasswordResetEmail(auth, email);
                    showAlert('success', 'If an account exists, a reset link was sent.');
                }
            } catch (error) {
                showAlert('error', getSecureErrorMessage(error.code));
            } finally {
                isSubmitting = false;
                ui.submitBtn.disabled = false;
                ui.submitText.classList.remove('hidden');
                ui.submitIcon.classList.remove('hidden');
                ui.submitSpinner.classList.add('hidden');
            }
        });

        ui.logoutBtn.addEventListener('click', () => signOut(auth));

        // Image Upload to Base64 logic
        ui.avatarUpload.addEventListener('change', (e) => {
            const file = e.target.files[0];
            if (!file) return;

            // Optional: Limit file size to 1MB to prevent large Firestore docs
            if (file.size > 1024 * 1024) {
                ui.setupError.textContent = "Image must be less than 1MB";
                ui.setupError.classList.remove('hidden');
                return;
            }

            ui.setupError.classList.add('hidden');
            const reader = new FileReader();
            reader.onload = (event) => {
                avatarBase64 = event.target.result;
                ui.avatarPreview.src = avatarBase64;
                ui.avatarPreview.classList.remove('hidden');
                ui.avatarPlaceholder.classList.add('hidden');
            };
            reader.readAsDataURL(file);
        });

        // Setup Form Submission
        ui.setupForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const user = auth.currentUser;
            if (!user) return;

            const name = ui.setupName.value.trim();
            const dob = ui.setupDob.value;

            if (!name || !dob) {
                ui.setupError.textContent = "Please fill in all fields.";
                ui.setupError.classList.remove('hidden');
                return;
            }

            ui.setupSubmitBtn.disabled = true;
            ui.setupSubmitText.classList.add('hidden');
            ui.setupSubmitSpinner.classList.remove('hidden');
            ui.setupError.classList.add('hidden');

            try {
                // Rule 1: Using secure private user path
                const profileRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'data');
                await setDoc(profileRef, {
                    name,
                    dob,
                    avatarBase64: avatarBase64 || '',
                    createdAt: new Date().toISOString()
                });

                // Transition to Dashboard immediately
                populateDashboard(user, { name, dob, avatarBase64 });
                showView('dashboard');
            } catch (error) {
                console.error("Profile Save Error:", error);
                ui.setupError.textContent = "Failed to save profile. Please try again.";
                ui.setupError.classList.remove('hidden');
            } finally {
                ui.setupSubmitBtn.disabled = false;
                ui.setupSubmitText.classList.remove('hidden');
                ui.setupSubmitSpinner.classList.add('hidden');
            }
        });

        function populateDashboard(user, profileData) {
            ui.userEmailDisplay.textContent = user.email;
            ui.userUidDisplay.textContent = user.uid;
            ui.displayName.textContent = profileData.name || 'Anonymous User';
            ui.displayDob.textContent = profileData.dob || 'Not provided';
            
            if (profileData.avatarBase64) {
                ui.displayAvatar.src = profileData.avatarBase64;
            } else {
                // Generate a placeholder based on initials
                const initial = (profileData.name || 'U').charAt(0).toUpperCase();
                ui.displayAvatar.src = `https://placehold.co/150x150/4f46e5/ffffff?text=${initial}`;
            }

            // Re-render Feather icons in case the dashboard contains new icons that were previously hidden
            setTimeout(() => {
                if (typeof feather !== 'undefined') feather.replace();
            }, 10);
        }

        if (auth) {
        onAuthStateChanged(auth, async (user) => {
            if (user) {
                showView('loading');
                try {
                    // Check if the user has completed their profile
                    const profileRef = doc(db, 'artifacts', appId, 'users', user.uid, 'profile', 'data');
                    const profileSnap = await getDoc(profileRef);

                    if (profileSnap.exists()) {
                        // User exists, send to dash.html (simulated via hash)
                        populateDashboard(user, profileSnap.data());
                        showView('dashboard');
                    } else {
                        // New user, push to setup
                        showView('setup');
                    }
                } catch (error) {
                    console.error("Profile Fetch Error:", error);
                    // If Firestore rules fail, safely route back to setup/auth
                    showView('setup'); 
                }
            } else {
                // No user detected, redirect to login.html (simulated via hash)
                showView('auth');
                updateUIForMode();
            }
        });
    } else {
        showView('auth');
        showAlert('error', "Authentication service unavailable. Please check configuration.");
    }

</script>
</body>
</html>
